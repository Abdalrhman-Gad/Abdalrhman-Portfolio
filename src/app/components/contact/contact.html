<h2 class="section-title">Contact</h2>

<div class="grid cols-2">
  <div class="glass left" inView>
    <h3>Let’s build something great ✨</h3>
    <p class="muted">
      I’m available for full-time roles and interesting freelance projects.
      Drop a message and I’ll get back quickly.
    </p>
    <div class="stack">
      <span class="tag"><i class="fa-solid fa-location-dot"></i> {{ ds.location }}</span>
      <a class="tag" [href]="'mailto:'+ds.email"><i class="fa-solid fa-envelope"></i> {{ ds.email }}</a>
      <a class="tag" href="tel:+201095725810"><i class="fa-solid fa-phone"></i> {{ ds.phone }}</a>
    </div>
  </div>

  <form class="glass form" [formGroup]="form" (ngSubmit)="submit()" inView>
    <label>
      <span>Name</span>
      <input type="text" formControlName="name" placeholder="Your name" />
      <small *ngIf="form.controls.name.touched && form.controls.name.invalid" class="err">Please enter your name.</small>
    </label>
    <label>
      <span>Email</span>
      <input type="email" formControlName="email" placeholder="you@example.com" />
      <small *ngIf="form.controls.email.touched && form.controls.email.invalid" class="err">Valid email required.</small>
    </label>
    <label>
      <span>Message</span>
      <textarea rows="5" formControlName="message" placeholder="How can I help?"></textarea>
      <small *ngIf="form.controls.message.touched && form.controls.message.invalid" class="err">At least 10 characters.</small>
    </label>
    <button class="btn" type="submit"><i class="fa-solid fa-paper-plane"></i> Send</button>
  </form>
</div>
